name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish src/Lyrix/Lyrix.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: Make screensaver copy
        shell: pwsh
        run: Copy-Item out/Lyrix.exe out/Lyrix.scr

      - uses: actions/upload-artifact@v4
        with:
          name: Lyrix-win-x64
          path: |
            out/Lyrix.exe
            out/Lyrix.scr

      - name: Attach to GitHub Release (tags like v0.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Lyrix.exe
            out/Lyrix.scr
